name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Secret preflight
        run: python preflight.py

      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test (pytest + coverage)
        run: PYTHONPATH=. python -m pytest -q --cov=. --cov-report=term-missing

      - name: Demo smoke + determinism
        run: PYTHONPATH=. python examples/run_demo.py

  release-gate:
    needs: quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag + Release (manual trigger recommended)
        run: echo "Push tag v0.1.0 locally via gh_push.py to create the GitHub Release."
